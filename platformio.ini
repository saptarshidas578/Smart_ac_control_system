; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:nodemcuv2]
platform = espressif8266
board = nodemcuv2
framework = arduino

; Recommended: Match this to your Serial.begin() speed in your code for the serial monitor
monitor_speed = 115200

; Optional: Speeds up the firmware upload time (default is usually 115200)
upload_speed = 921600
lib_deps =
    adafruit/Adafruit MAX31865 library
    adafruit/Adafruit NeoPixel
    witnessmenow/UniversalTelegramBot
    bblanchon/ArduinoJson